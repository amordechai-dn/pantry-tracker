<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#34A853" />
    <meta name="description" content="HomeStock — smart home inventory. Track what you have at home. Offline PWA." />
    <title>HomeStock — Smart Home Inventory</title>

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/icon-16.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" />

    <!-- iOS standalone hints -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HomeStock" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="root"></div>

    <!-- vendor/zxing.min.js (~336KB) is NOT loaded here: it is lazy-loaded on
         first scanner open (see loadZXing in app.js) and precached by the SW so
         it still resolves from cache offline, keeping it off the startup path. -->
    <script src="./data/foods.js"></script>
    <script src="./i18n.js"></script>
    <script src="./db.js"></script>
    <script src="./auth.js"></script>
    <script src="./app.js"></script>
    <script src="./pwa.js"></script>
    <script>
      window.App.start();
    </script>
  </body>
</html>
